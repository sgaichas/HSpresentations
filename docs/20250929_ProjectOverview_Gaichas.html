# Project Overview: Objectives

.pull-left-70[

1) Review and assess existing ecosystem and habitat indicators in the Northeast and evaluate their utility to support management objectives;

2) Identify and develop priority ecosystem and habitat indicators, including associated targets and thresholds as appropriate, and identify specific pathways for incorporation into Council management processes, documents, or actions; and

3) Create workflow and communication tools to support regular updates of indicators and that enhance usability of indicators in the management process.

]

.pull-right-30[]

![:img MAFMC fishery management plans and species, 80%](https://github.com/NOAA-EDAB/presentations/raw/master/docs/EDAB_images/MAFMPs4.png)

# Workplan: Objective 1

*Review and assess existing ecosystem and habitat indicators in the Northeast and evaluate their utility to support management objectives*

.pull-left[
**Indicator Review:** *underway, ~70% complete*

* Current Council Indicators  
    * State of the Ecosystem Report   
    * EAFM Risk Assessment  
    * Ecosystem Socioeconomic Profiles  
* Relevant New Indicators   
    * US EPA, MARCO, State, Local  
    * Global sources (FAO)  
    * Peer-reviewed literature  
* Compile indicator attributes in [SMART format](https://mafmc.github.io/SMARTindicatorsData/)
* Summarize and develop indicator search tool

]

.pull-right[

**In Person Workshop 1:** *planning underway*

* Identify and prioritize Council management decisions that could be supported by tactical use of ecosystem indicators
* Format
    * Introduce preliminary list of Council decisions/processes
    * Discuss and clarify list and fill gaps
    * From full list, identify top 3 priority decisions for indicator development and analysis
    * Identify preliminary indicators that may support priority decisions

]

**Deliverables:** Indicator review with SMART screening evaluation relative to priority management decisions

---
# Workplan: Objective 2

*Identify and develop priority ecosystem and habitat indicators, including associated targets and thresholds, and identify specific pathways for incorporation into Council management processes, documents, or actions*

.pull-left[
**Online mini-workshop, indicator development**

* Mini-workshop identifies indicators for priority management decisions using SMART screening
    * Identify desirable and undesirable states for management outcomes
    * Identify potential indicator targets and thresholds linked to states
* Indicator and target/threshold development
    * Literature review for existing thresholds
    * Indicator data acquisition and/or model development as necessary
    * Empirical threshold identification and testing

]

.pull-right[
**In person Workshop 2, Indicator simulation testing** 

* Workshop develops performance criteria
    * Review preliminary indicators, targets, thresholds
    * Identify measures of management success and "good" vs "bad" indicator levels
    * Identify uncertainties to include: environment? markets?
* Simulation testing indicator-based management
    * Evaluate management performance under the range of uncertainties
    * Highlight optimal conditions for indicator use and pathways for inclusion in Council management
]

# Deliverables and Schedule: Phase 1

**Project duration ~2 years, with monthly Project Oversight Team updates**

*  **July-November 2025:** Comprehensive Indicator Review and interactive search tool development

*  **8 August 2025:** MAFMC GitHub organization and repositories established to support regular updates of all project products into the future 

*  **10 November 2025:** Draft Indicator Review report and prototype interactive search tool to Project Oversight Team for feedback and revision

*  **TBD December 2025:** In person Council Workshop 1 identifying priority Council management decisions for indicator development, early career researcher and student experience in Council processes

*  **9 February 2026:** Final Indicator Review report with gap analysis and SMART screening relative to priority Council management decisions

---
# Deliverables and Schedule: Phase 2

**Project duration ~2 years, with monthly Project Oversight Team updates**

*  **TBD February 2026:** Online Council Mini-workshop selecting indicator subset for development and testing, early career researcher and student experience in Council processes

*  **February-December 2026:** Indicator development and testing: data acquisition, model development, preliminary target and threshold analysis, visualization and communication tool development and deployment, Council staff training in reproducible workflows

*  **TBD December 2026:** In person Council Workshop 2 identifying indicator performance metrics, review preliminary targets and thresholds, early career researcher and student experience in Council processes

*  **January-June 2027:** Indicator target/threshold simulation testing under a range of uncertainties, identify pathways for management use, indicator workflow automation

*  **30 June 2027:** Final Report to Council, Present all project results including operational infrastructure at Council meeting
