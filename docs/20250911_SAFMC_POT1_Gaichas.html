# Project Overview: Objectives

1) Review the different types of ecosystem data and information including data products and
decision-support tools (e.g. Ecosystem Status Reports, Climate Vulnerability Assessments, risk
assessments) currently available to the regional management councils and evaluate how they are
used in council management processes;

2) Identify opportunities and methods for incorporating identified ecosystem information into
SAFMC management processes, including inter-jurisdictional management decision-making
processes, and identify practical requirements for successful implementation (e.g. data quality,
frequency of information updates, regional council process consistency, implementation
timelines); and

3) Identify opportunities to continue to expand cooperative, constituent-engaged data collection
and research to improve the available ecosystem information in the South Atlantic region (e.g.,
study fleets, cooperative research, citizen science).

---
# Workplan: Objective 1

*Review the different types of ecosystem data and information including data products and decision-support tools (e.g. Ecosystem Status Reports, Climate Vulnerability Assessments, risk assessments) currently available to the regional management councils and evaluate how they are used in council management processes*

.pull-left[
**Literature search:** *underway, ~90% complete*

* Council documents (policy guidance documents, FMPs/FEPs)
* Data products (Ecosystem Status Reports, Climate Vulnerability Assessments)
* Peer-reviewed literature

All 8 Councils, including SAFMC, plus selected others

**Feedback requested: useful summary format?**

]

.pull-right[

**Structured interviews:** *planning*

* Key Council staff and members (2-4 per region)
* Interview Template:
    * Review/validate data products and uses of record from lit review
    * What other uses are not recorded?
    * Successes and challenges with current information and processes?
    * What might be done differently to better meet Council objectives?

**Feedback requested: other questions?**
]

---
# Workplan: Objective 2

*Identify opportunities and methods for incorporating identified ecosystem information into SAFMC management processes, including inter-jurisdictional management decision- making processes, and identify practical requirements for successful implementation (e.g. data quality, frequency of information updates, regional council process consistency, implementation timelines)*

.pull-left[
**Initial focus on catch specification**

* Utility of an ecosystem profile approach?
* Climate vulnerability consideration in uncertainty buffers for ABC setting?
* Risk table approaches used/piloted in other regions?

]

.pull-right[
**Broaden to other processes using a review of 3-5 years of Council actions** 

* Classify management decisions by data needs and process timelines
* Develop a prioritized list of processes linked to ecosystem information
* Recommend practical pathways for implementation

**Feedback requested: priority management actions?**

]
