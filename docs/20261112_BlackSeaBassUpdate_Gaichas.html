## Available Bottom Temperature Forecasts

For harmonization with GLORYS hindcast series, this is the bias adjustment procedure that had been suggested:

For each projection year `\(i\)`:

`\(Δ_i\)` = `\(MOM6Temp_i - mean(MOM6HindcastTemps)\)`

`\(BiasCorrectedTemp_i\)` = `\(mean(GLORYSObservedHindcastData) + Δ_i\)`
