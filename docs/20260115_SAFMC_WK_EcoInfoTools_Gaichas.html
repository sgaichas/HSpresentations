## Ecosystem Information: Definitions and abbreviations

.pull-left-60[
**Ecosystem Status Report (ESR)**: a document summarizing ecosystem information for a particular region, spanning physical, biological, economic, and social information. 

*  Indicators are presented and interpreted in the context of historical trends and current status relative to any known reference points. 
*  Trends and status of indicators can contribute to risk assessment at the ecosystem or stock level. 
*  Also known as State of the Ecosystem (SOE) or Ecosystem Considerations reports.

## Ecosystem Information: Definitions and abbreviations

.pull-left-60[

**Climate Vulnerability Analysis (CVA)**: an evaluation of vulnerability to projected climate conditions based on standard metrics of sensitivity and exposure appropriate to the species, habitat, or community being assessed. 

*  In addition to detailed narratives of risks faced by each species, habitat, or community, CVA outputs include a ranking of risk across species, habitats, or communities within a region, facilitating risk assessment. 
*  CVA has been applied to marine fish and invertebrates, marine fish and invertebrate habitats, marine mammals, and fishing communities.

## Ecosystem Information: Definitions and abbreviations

.pull-left-60[
**Fishery Management Plan (FMP)**: a legally required document outlining methods (management measures, regulations, monitoring, research) to achieve fishery management objectives as specified in the U.S. Magnuson-Stevens Fishery Conservation and Management Act. 

Councils:
*  determine which fisheries are included in an FMP, 
*  describe targeted species and fishing methods, 
*  identify essential habitat, and 
*  design methods to ensure sustainable Optimum Yield* while meeting other objectives such as bycatch reduction and other legal mandates for protected species. 

*OY: maximum benefit to the Nation in terms of seafood production and recreational opportunities while accounting for the protection of marine ecosystems
]

.pull-right-30[
.footnote[
Source: https://safmc.net/fishery-management/
]
]

## Fishery Management Plan Objectives

Official name: Fishery Management Plan for the Snapper Grouper Fishery of the South Atlantic Region.

.pull-left[
&lt;span style="color: blue;"&gt;**Goal 1 (Science):**&lt;/span&gt;
Management decisions for the snapper grouper fishery are based upon robust, defensible science that considers qualitative and quantitative data analyzed in a timely, clear, and transparent manner that builds stakeholder confidence. 
.table[
*  Promote collection of quality data to support management plans and programs considered by the Council. 
*  Encourage the development of mechanisms to effectively engage and collaborate with stakeholders on cooperative research, data collection, and analysis. 
*  &lt;span style="color: blue;"&gt;**Improve knowledge about the social and economic elements of the snapper grouper fishery in the South Atlantic.**&lt;/span&gt; 
*  Support improved and expanded monitoring and reporting programs for the snapper grouper fishery. 
*  &lt;span style="color: blue;"&gt;**Promote data collection and analysis to support ecosystem and habitat considerations for the snapper grouper fishery.**&lt;/span&gt;
]
]

.pull-right[
&lt;span style="color: blue;"&gt;**Goal 2 (Management):**&lt;/span&gt;
Adopt management strategies for the snapper grouper fishery that rebuild and maintain fishery resources, adapt to regional differences in the fishery, and consider the social and economic needs of fishing communities. 
.table[
*  &lt;span style="color: blue;"&gt;**Develop management measures that consider sub-regional differences and issues within the fishery.**&lt;/span&gt; 
*  Develop innovative management measures that allow consistent access to the fishery for all sectors. 
*  &lt;span style="color: blue;"&gt;**Ensure that management decisions help maximize social and economic opportunity for all sectors.**&lt;/span&gt; 
*  Develop management measures that reduce and mitigate discards. 
*  &lt;span style="color: blue;"&gt;**Support management measures that incorporate ecosystem and habitat considerations for the snapper grouper fishery.**&lt;/span&gt; 
*  Develop management measures that support optimal sector allocations for the snapper grouper fishery. 
]
]

.footnote[
Source: https://safmc.net/fishery-management-plans/snapper-grouper/
]

???

Goal 3 (Communication)
Employ interactive outreach strategies that encourage continuous participation and support two-way engagement between managers and snapper grouper fishery stakeholders while building a greater understanding of science and management.  

*  Develop communication approaches that provide streamlined and timely information to increase awareness and engage stakeholders. 
*  Ensure that Council communication encourages and supports engagement with a diverse audience of stakeholders. 
*  Improve awareness and understanding of fishery science and research and how these inform management. 
*  Improve awareness and understanding of how social and economic issues are linked to fisheries management measures. 

Goal 4 (Governance)
Commit to a transparent, balanced, and timely decision-making process that allows flexible yet well-defined protocols and strategies for managing the snapper grouper fishery. 

*  Create an accountable and flexible decision-making process for development and evaluation of management measures. 
*  Build capacity to streamline management efforts and better coordinate with management partners. 
*  Improve communication with stakeholders to ensure the needs of the fishery are understood and considered throughout the Council process.

## Ecosystem Information: Definitions and abbreviations

.pull-left-60[

**Fishery Ecosystem Plan (FEP)**: a document outlining methods for ecosystem-based fishery management by providing an ecosystem description, overarching ecosystem policies and goals, and methods for coordinating across managed fisheries and addressing ecosystem interactions. 

*  When FEPs contain all components of an FMP, they can be used as FMPs (Western Pacific). 

![:img HawaiiFEP, 20%](https://github.com/sgaichas/HSpresentations/raw/main/docs/images/HawaiiFEP.png)![:img MarianaFEP, 20%](https://github.com/sgaichas/HSpresentations/raw/main/docs/images/MarianaFEP.png)![:img AMSamoaFEP, 20%](https://github.com/sgaichas/HSpresentations/raw/main/docs/images/AMSamoaFEP.png)![:img PRIAFEP, 20%](https://github.com/sgaichas/HSpresentations/raw/main/docs/images/PRIAFEP.png)![:img PelagicFEP, 20%](https://github.com/sgaichas/HSpresentations/raw/main/docs/images/PelagicFEP.png)

*  FEPs were originally outlined and recommended in a 1999 report to Congress, and operational methods for refining and using FEPs have been advanced more recently.  

.footnote[
Source: https://www.wpcouncil.org/fishery-ecosystem-plans-amendments/
]

]

Sources: [SAFMC FEP I](https://safmc.net/documents/combined-fep_toc-pdf/), [FEP II](https://safmc.net/documents/fishery-ecosystem-plan-2-fep-ii/)

## Ecosystem Information: Definitions and abbreviations

.pull-left-60[
**Ecosystem Socioeconomic Profile (ESP)**: a document summarizing ecosystem information for a particular *stock*, spanning physical, biological, economic, and social information. 

*  *ESR for a stock*
*  Based on a life history conceptual model identifying key bottlenecks and drivers
*  Indicators are presented and interpreted in the context of historical trends and current status relative to any known reference points. 
*  Trends and status of indicators can contribute to risk assessment at the stock level. 

*  Alaska invented, Northeast adopted (but does not use in the same way)

]

.pull-right-30[
.footnote[
Source: https://www.fisheries.noaa.gov/feature-story/integrating-ecosystem-and-socioeconomic-information-fisheries-management
]
]

y; minor unresolved issues in assessment.&lt;/span&gt;&lt;/p&gt;&lt;/td&gt;&lt;td class="cl-c5b78e0b"&gt;&lt;p class="cl-c5b7812e"&gt;&lt;span class="cl-c5b5b524"&gt;Stock trends are typical for the stock; recent recruitment is within normal range.&lt;/span&gt;&lt;/p&gt;&lt;/td&gt;&lt;td class="cl-c5b78e0b"&gt;&lt;p class="cl-c5b7812e"&gt;&lt;span class="cl-c5b5b524"&gt;No apparent environmental/ecosystem concerns.&lt;/span&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr style="overflow-wrap:break-word;"&gt;&lt;td class="cl-c5b78e0a"&gt;&lt;p class="cl-c5b7812e"&gt;&lt;span class="cl-c5b5b524"&gt;Level 2: Substantially increased concerns&lt;/span&gt;&lt;/p&gt;&lt;/td&gt;&lt;td class="cl-c5b78e0b"&gt;&lt;p class="cl-c5b7812e"&gt;&lt;span class="cl-c5b5b524"&gt;Substantially increased assessment uncertainty or unresolved issues.&lt;/span&gt;&lt;/p&gt;&lt;/td&gt;&lt;td class="cl-c5b78e0b"&gt;&lt;p class="cl-c5b7812e"&gt;&lt;span class="cl-c5b5b524"&gt;Stock trends are unusual; abundance increasing or decreasing faster than has been seen recently, or recruitment pattern is atypical.&lt;/span&gt;&lt;/p&gt;&lt;/td&gt;&lt;td class="cl-c5b78e0b"&gt;&lt;p class="cl-c5b7812e"&gt;&lt;span class="cl-c5b5b524"&gt;Some indicators showing an adverse signals but the pattern is not consistent across all indicators.&lt;/span&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr style="overflow-wrap:break-word;"&gt;&lt;td class="cl-c5b78e0a"&gt;&lt;p class="cl-c5b7812e"&gt;&lt;span class="cl-c5b5b524"&gt;Level 3: Major Concern&lt;/span&gt;&lt;/p&gt;&lt;/td&gt;&lt;td class="cl-c5b78e0b"&gt;&lt;p class="cl-c5b7812e"&gt;&lt;span class="cl-c5b5b524"&gt;Major problems with the stock assessment; very poor fits to data; high level of uncertainty; strong retrospective bias.&lt;/span&gt;&lt;/p&gt;&lt;/td&gt;&lt;td class="cl-c5b78e0b"&gt;&lt;p class="cl-c5b7812e"&gt;&lt;span class="cl-c5b5b524"&gt;Stock trends are highly unusual; very rapid changes in stock abundance, or highly atypical recruitment patterns.&lt;/span&gt;&lt;/p&gt;&lt;/td&gt;&lt;td class="cl-c5b78e0b"&gt;&lt;p class="cl-c5b7812e"&gt;&lt;span class="cl-c5b5b524"&gt;Multiple indicators showing consistent adverse signals a) across the same trophic level, and/or b) up or down trophic levels (i.e., predators and prey of stock)&lt;/span&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr style="overflow-wrap:break-word;"&gt;&lt;td class="cl-c5b78e12"&gt;&lt;p class="cl-c5b7812e"&gt;&lt;span class="cl-c5b5b524"&gt;Level 4: Extreme concern&lt;/span&gt;&lt;/p&gt;&lt;/td&gt;&lt;td class="cl-c5b78e13"&gt;&lt;p class="cl-c5b7812e"&gt;&lt;span class="cl-c5b5b524"&gt;Severe problems with the stock assessment; severe retrospective bias. Assessment considered unreliable.&lt;/span&gt;&lt;/p&gt;&lt;/td&gt;&lt;td class="cl-c5b78e13"&gt;&lt;p class="cl-c5b7812e"&gt;&lt;span class="cl-c5b5b524"&gt;Stock trends are unprecedented. More rapid changes in stock abundance than have ever been seen previously, or a very long stretch of poor recruitment compared to previous patterns.&lt;/span&gt;&lt;/p&gt;&lt;/td&gt;&lt;td class="cl-c5b78e13"&gt;&lt;p class="cl-c5b7812e"&gt;&lt;span class="cl-c5b5b524"&gt;Extreme anomalies in multiple ecosystem indicators that are highly likely to impact the stock. Potential for cascading effects on other ecosystem components.&lt;/span&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

;border-top: 0.00pt solid transparent;border-left: 0.00pt solid transparent;border-right: 0.00pt solid transparent;padding-top:3pt;padding-bottom:3pt;padding-left:3pt;padding-right:3pt;line-height: 1;background-color:transparent;"&gt;&lt;span&gt;Risk table evaluation for Gulf of Alaska pollock in the 2018 stock assessment.&lt;/span&gt;&lt;/caption&gt;&lt;thead&gt;&lt;tr style="overflow-wrap:break-word;"&gt;&lt;th class="cl-c5be4554"&gt;&lt;p class="cl-c5be3ac8"&gt;&lt;span class="cl-c5bcc620"&gt;Assessment-related considerations&lt;/span&gt;&lt;/p&gt;&lt;/th&gt;&lt;th class="cl-c5be4554"&gt;&lt;p class="cl-c5be3ac8"&gt;&lt;span class="cl-c5bcc620"&gt;Population dynamics considerations&lt;/span&gt;&lt;/p&gt;&lt;/th&gt;&lt;th class="cl-c5be455e"&gt;&lt;p class="cl-c5be3ac8"&gt;&lt;span class="cl-c5bcc620"&gt;Environmental/ecosystem considerations&lt;/span&gt;&lt;/p&gt;&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr style="overflow-wrap:break-word;"&gt;&lt;td class="cl-c5be455f"&gt;&lt;p class="cl-c5be3ac8"&gt;&lt;span class="cl-c5bcc620"&gt;Contradictory data, very poor model fits to recent survey indices. But model seems robust, no retrospective pattern.Conclusion: Level 2, substantially increased concerns&lt;/span&gt;&lt;/p&gt;&lt;/td&gt;&lt;td class="cl-c5be455f"&gt;&lt;p class="cl-c5be3ac8"&gt;&lt;span class="cl-c5bcc620"&gt;Stock dominated by a single year class. Four years of very weak recruitment. There have been similar patterns in the past, but never this extreme.Conclusion: Level 2, substantially increased concerns&lt;/span&gt;&lt;/p&gt;&lt;/td&gt;&lt;td class="cl-c5be4560"&gt;&lt;p class="cl-c5be3ac8"&gt;&lt;span class="cl-c5bcc620"&gt;Onset of a marine heatwave and projections of a weak El Niño are not conducive for winter survival for age-0 pollock. Zooplankton indicators are mixed. Some suggest prey for adult pollock is abundant, but planktivorous parakeet auklets in the central GOA had poor reproductive success in 2018.Conclusion: Level 2, substantially increased concerns&lt;/span&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

## How has MAFMC used the risk assessment?

* Risk based prioritization: the Council selected summer flounder for [conceptual modeling](https://nefsc.github.io/READ-SSB-DePiper_Summer_Flounder_Conceptual_Models/sfconsmod_riskfactors_subplots.html)

* Council completed management strategy evaluation (MSE) addressing [recreational fishery discards](https://www.mafmc.org/actions/summer-flounder-mse) based on conceptual modeling

* Stakeholder driven MSE coupled population and recreational demand models

![](https://github.com/NOAA-EDAB/presentations/raw/master/docs/EDAB_images/keepOneNoOFkey.png)

* Results: potential improvement in angler welfare with low risk to stock status, multispecies recreational demand model sets specifications
]

---
## Initial Synthesis: Three General Approaches to using Ecosystem Information

1. FMP/Indicator-Based (NPFMC, PFMC, MAFMC, NEFMC) 
  - Species-based Fishery Management Plans with ecosystem overlays 
  - Annual ecosystem indicators inform catch specification decisions 
  - Risk tables and uncertainty frameworks integrate ecosystem considerations 
  - Non-regulatory Fishery Ecosystem Plans (FEPs) provide actionable pathways

2. FEP/Geography-Based (WPFMC, CFMC) 
  - Island or place-based ecosystem plans serve as operational management documents 
  - Co-developed with stakeholders reflecting distinct regional conditions 
  - Emphasis on human community connections and data-limited fisheries 
  - Ecosystem considerations embedded in management structure

3. Developing Approaches (SAFMC, GFMC) 
  - Species-based FMPs with expanding ecosystem integration 
  - SAFMC uniquely links Essential Fish Habitat (EFH) with ecosystem efforts 
  - Gulf developing Fishery Ecosystem Issues (FEIs) as action-oriented framework 
  - Both regions have recent ecosystem reports and climate vulnerability assessments

## Potential for wider use of CVAs across regions

---
## Common Management Concerns

**Forage Fish Ecology:** Multiple Councils have implemented protections for unmanaged forage species or developed harvest control rules accounting for ecosystem services (notably ASMFC’s ecological reference points for Atlantic menhaden).

**Climate Change Impacts:** All regions are addressing rapid ecosystem changes, though even data-rich systems with long-term ecosystem reporting have experienced unexpected stock collapses, highlighting the need for climate-ready management approaches.

## Promising Practices

**Risk-Based Frameworks:** North Pacific, Pacific, New England, and Mid-Atlantic are developing or implementing indicator-based risk assessments to adjust catch advice

**Stakeholder Co-Production:** Most FEPs emphasize collaborative development of ecosystem models and indicators with fishers, managers, and scientists

**Actionable Processes:** “Action modules” (North Pacific), “Initiatives” (Pacific), and “Fishery Ecosystem Issues” (Gulf) provide structured pathways from ecosystem plans to management action

**Ecosystem and Socioeconomic Profiles (ESPs):** Stock-specific ecosystem reports (pioneered by North Pacific, adopted by Northeast) link environmental drivers to individual stock productivity
