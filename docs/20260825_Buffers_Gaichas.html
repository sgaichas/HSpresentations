## Buffers on F are used to avoid exceeding `\(F_{MSY}\)` in the US

Eight regional Fishery Management Councils establish plans for sustainable management of stocks within their jurisdictions. All are governed by the same law, but tailor management to their regional stakeholder needs.  
.center[
![:img US map highlighting regions for each fishery management council, 75%](https://github.com/sgaichas/presentations/raw/main/docs/EDAB_images/USCouncils.png)
]

More information: http://www.fisherycouncils.org/  
https://www.fisheries.noaa.gov/topic/laws-policies#magnuson-stevens-act

## Main requirements  &lt;a name=cite-dicosimo_use_2010&gt;&lt;/a&gt;&lt;a name=cite-methot_implementing_2014&gt;&lt;/a&gt;([DiCosimo et al., 2010](https://academic.oup.com/icesjms/article/67/9/1861/619696); [Methot et al., 2014](https://academic.oup.com/icesjms/article/71/2/183/781079))
.pull-left-40[
Managers are [required](https://www.ecfr.gov/current/title-50/section-600.310) by [law](https://www.fisheries.noaa.gov/s3//dam-migration/msa-amended-2007.pdf) to take action that avoids or ends:  

Overfishing
- *too much fishing mortality*
- `\(F &gt; F_{MSY}\)`

Overfished status
- *too little biomass*
- `\(B &lt; \frac12 B_{MSY}\)`

Overfished status &amp;rarr; Rebuilding Plan
- *grow overfished stock back*
- `\(B = B_{MSY}\)`


]

## Two general approaches

.pull-left[
### Prescribed `\(F_{ABC}\)` or ABC

New England: by FMP
*  Groundfish: constant 75% of `\(F_{MSY}\)`
*  Hakes: 25th-40th %ile of OFL posterior
*  Herring: ramped, max 80% of `\(F_{MSY}\)`
*  Monkfish: avg exploitation rate for certain years
*  Skates: empirical catch/survey rule
*  Red crab: constant catch 2000 t
*  Sea scallop: `\(F_{ABC}\)` has 25% probability of exceeding `\(F_{MSY}\)`

North Pacific Groundfish data tiers
*  Data rich: harmonic mean of `\(F_{MSY}\)` posterior
*  Data moderate: `\(F_{40\%}\)` (`\(F_{MSY}\)` proxy is `\(F_{35\%}\)`)
*  Data poor: 75% of `\(F_{MSY}\)` 
*  Catch only: 75% of 1978-1995 average


]

.pull-right[
### Risk/Uncertainty Framework

Control rules are based on stated risk policy with stock biomass status as an indicator. Risk policies specify lower probabilities of overfishing below `\(B_{MSY}\)`. Buffers  derived from criteria applied by stock

Mid-Atlantic
*  OFL CV process 

South Atlantic (3 FMPs)
*  Risk Assessment process

## Tradeoffs of the two approaches

.pull-left[
### Prescribed `\(F_{ABC}\)`

*  Simple and streamlined to implement
*  Can't account for changing conditions or stock specific risks
*  Finding a buffer that works across many situations is difficult
]

.pull-right[
### Risk/Uncertainty Framework

*  Can account for changing conditions or stock specific risks
*  More complex implementation, consider each stock separately
*  Requires a process for consistent decision making
]

In the US system it is the responsibility of the Scientific and Statistical Committee of each Council to determine the ABC, so where it is not prescribed the SSC process determines the F buffer. 

In ICES it would be... ACOM?

Stock assessors often provide the prescribed ABCs, or do multiple projections to provide the range of options under the risk/uncertainty framework.

## Acceptable Biological Catch (ABC) determination: Mid Atlantic approach

.pull-left[
### Council Risk Policy

&lt;img src="20260825_Buffers_Gaichas_files/figure-html/MAFMCriskpolicy-1.png" alt="" width="504" /&gt;

]

.pull-right[
### ABC proportion of OFL given OFL CV

&lt;img src="20260825_Buffers_Gaichas_files/figure-html/OFLCVtoABC-1.png" alt="" width="504" /&gt;

]

The point estimate of the OFL (~MSY) from the stock assessment is used as the median of a lognormal distribution with a coefficient of variation (CV) specified by the SSC.

.center[`ABC &lt;- OFL * qlnorm(pstar, log(1), log(OFL_CV + 1))`] 

.footnote[
See [MAFMC ABC control rule](http://www.mafmc.org/s/MAFMC-ABC-Control-Rule-White-Paper.pdf) and [update for 2020 MAFMC risk policy](https://www.mafmc.org/s/b_Implications-of-MAFMC-Risk-Policy-for-Multi.pdf)
]

## How to get the OFL CV? Characterizing scientific uncertainty in the Mid-Atlantic

.pull-left-30[
**Scientific and Statistical Committee (SSC) evaluates 6 criteria with metrics that point to either default, low, or high uncertainty in the OFL**

1. Data quality
1. Model appropriateness and identification 
1. Retrospective analysis
1. Empirical comparisons
1. Ecosystem factors 
1. Recruitment trends

An overall CV value for the OFL should be no *lower* than the value of the lowest CV value assigned for any of the first three criteria.
]

.pull-right-70[
**1. Data quality (Tier 1)**  
.table[
*  Important fishery-independent data considerations include survey design, coverage
(of the unit stock area), and efficiency of survey gear;
    +  60% CV in simulation studies was achieved when survey indices were
accurate. In the real world, important considerations for achieving this
criterion is that the survey coverage matches the stock’s range in time and
space;
    +  Missing temporal and spatial survey coverage in areas important to a species
increases uncertainty;
*  Fishery-dependent considerations include accuracy and precision of landings and
discards;
    +  60% CV in simulations occurs when fishery catch is known with low
uncertainty, e.g., &lt;10%
    +  For some species, data quality (e.g., predominance of recreational catch)
often leads to inherently higher uncertainty that cannot be overcome by low
uncertainty in other criteria listed below;
    +  Need informative data to conduct a stock assessment: the fishery needs to have a measurable effect on the population
for typical stock assessments to perform well;
*  Availability of age and/or length data for fishery-independent and dependent
sources; validity of underlying assumptions and any potential data borrowing (i.e.,
gap filling);
    +  60% CV in simulations was achieved when age data are accurate and highly
precise (i.e., no aging error and a random sample from the catch or survey);
*  Data in support of key model parameters;
    +  60% CV in simulations has M specified at the correct value and relies on
appropriate models for catchability and selectivity. 
]
]

.footnote[
See [MAFMC SSC OFL CV Guidance Document](https://www.mafmc.org/s/Final-OFL-CV-guidance-document_06_24.pdf)
]

##  Characterizing scientific uncertainty (Tier 1)

&lt;table class="table" style="font-size: 16px; margin-left: auto; margin-right: auto;"&gt;
 &lt;thead&gt;
  &lt;tr&gt;
   &lt;th style="text-align:left;"&gt; Decsion Criteria &lt;/th&gt;
   &lt;th style="text-align:left;"&gt; Default OFL CV = 60% &lt;/th&gt;
   &lt;th style="text-align:left;"&gt; Default OFL CV = 100% &lt;/th&gt;
   &lt;th style="text-align:left;"&gt; Default OFL CV = 150% &lt;/th&gt;
  &lt;/tr&gt;
 &lt;/thead&gt;
&lt;tbody&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; Data quality &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; One or more synoptic surveys of the whole stock area for multiple years. High quality monitoring of landings and size and age composition. Long term, precise monitoring of discards. Landings estimates highly accurate. &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; Low precision synoptic surveys or one or more regional surveys which lack coherency in trend. Age and/or length data available with uncertain quality. Lacking or imprecise discard estimates. Moderate accuracy of landings estimates &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; No reliable abundance indices. Catch estimates are unreliable. No age and/or length data available or highly uncertain. Natural mortality rates are unknown or suspected to be highly variable. Incomplete or highly uncertain landings estimates &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; Model appropriateness and identification process &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; Multiple differently structured models agree on outputs; many sensitivities explored. Model appropriately captures/considers species life history and spatial/stock structure. &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; Single model structure with many parameter sensitivities explored. Moderate agreement among different model runs indicating low sensitivities of model results to specific parameterization. &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; Highly divergent outputs from multiple models without indication of which scenario is most likely or no exploration of alternative model structures or sensitivities. &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; Retrospective analysis &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; Minor retrospective patterns. &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; Moderate retrospective patterns. &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; No retrospective analysis or severe retrospective patterns (e.g., terminal year values adjusted and outside confidence region). &lt;/td&gt;
  &lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;

## South Atlantic [Comprehensive ABC Control Rule](https://safmc.net/documents/abccram_06052023_submittal-pdf/)

.pull-left[
Dolphin-Wahoo, Golden Crab, Snapper Grouper FMPs

&lt;img src="20260825_Buffers_Gaichas_files/figure-html/ABCSAFMC-1.png" alt="" width="504" /&gt;

]

.pull-right[
Council reviews SSC and AP advice on risk rating.  
Council can deviate, up or down, from default P* by up to 10% (not exceeding 0.5).  

Specific attributes that can inform risk of overfishing:
* Biological:
    * Estimated natural mortality
    * Age at maturity
* Human Dimension:
    * Ability to regulate fishery
    * Potential for discard losses
    * Annual commercial value
    * Recreational desirability
    * Social concerns
* Environmental:
    * Ecosystem importance--&lt;span style="color: blue;"&gt;Food web indicators&lt;/span&gt; 
    * Climate change--&lt;span style="color: blue;"&gt;CVA indicators&lt;/span&gt; 
    * Other environmental variables--&lt;span style="color: blue;"&gt;stock specific indicators&lt;/span&gt; 
]

## Pacific Risk Tables (in testing)

Three Categories: Ecosystem and environmental conditions, Assessment data inputs, Assessment model fits and structural uncertainty

Builds on existing process with prescribed OFL sigmas based on species life history and assessment category determining the Risk Buffer

Evaluates a range of metrics to assign Favorable, Neutral, or Unfavorable Risk Levels for each Category.

Risk ranking is done by the combined assessment and ecosystem team.

The Categories are unweighted but the SSC may weight them to come up with an overall Risk to adjust the sigma and produce the buffer.

Potential Action:  
Favorable Conditions &amp;rarr; &lt;span style="background-color:#00FF0050;"&gt;Decrease Risk Buffer (Higher Catch Recommendation)&lt;/span&gt;  
Neutral Conditions &amp;rarr; Keep Standard Risk Buffer (Standard Catch Recommendation)  
Unfavorable Conditions &amp;rarr; &lt;span style="background-color:#FF000050;"&gt;Increase Risk Buffer (Lower Catch Recommendation)&lt;/span&gt;

.footnote[
Source: [CCIEA Risk Table Report](https://www.pcouncil.org/documents/2024/08/h-1-a-cciea-team-report-1-cciea-risk-table-report-on-fep-initiative-4.pdf/)
]

&lt;/span&gt;&lt;/p&gt;&lt;/th&gt;&lt;th class="cl-453fa343"&gt;&lt;p class="cl-453f9136"&gt;&lt;span class="cl-453dfd9e"&gt;Assessment Data Inputs&lt;/span&gt;&lt;/p&gt;&lt;/th&gt;&lt;th class="cl-453fa344"&gt;&lt;p class="cl-453f9136"&gt;&lt;span class="cl-453dfd9e"&gt;Assessment Model Fits and Structural Uncertainty&lt;/span&gt;&lt;/p&gt;&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr style="overflow-wrap:break-word;"&gt;&lt;td class="cl-453fa345"&gt;&lt;p class="cl-453f9136"&gt;&lt;span class="cl-453dfd9e"&gt;Level 1: Favorable&lt;/span&gt;&lt;/p&gt;&lt;/td&gt;&lt;td class="cl-453fa34c"&gt;&lt;p class="cl-453f9136"&gt;&lt;span class="cl-453dfd9e"&gt;Indicators not used in the stock assessment show medium to high level of agreement and moderate to strong evidence supporting high species productivity.&lt;/span&gt;&lt;/p&gt;&lt;/td&gt;&lt;td class="cl-453fa34d"&gt;&lt;p class="cl-453f9136"&gt;&lt;span class="cl-453dfd9e"&gt;Reliable catch reconstruction, informative fishery-independent survey, age and length composition data for landed fish and bycatch for key fleets across a range of years, solid fits to data (with minimal conflicts between data sources), maturity data from samples collected across time and the model area, species-specific fecundity in the California Current Ecosystem&lt;/span&gt;&lt;/p&gt;&lt;/td&gt;&lt;td class="cl-453fa34e"&gt;&lt;p class="cl-453f9136"&gt;&lt;span class="cl-453dfd9e"&gt;Most productivity parameters across multiple processes (recruitment, natural mortality, growth) are estimated internally, minimal evidence for temporally and/or spatially varying biology (or non-stationarity is accounted for in the model), sensitivity model runs are within the estimated parametric uncertainty, sensitivities are symmetric around the base model, no long-term trends in recruitment (or these trends are captured in the forecast), steep likelihood profiles and stable jitters indicating parameters are well-estimated, minimal evidence of retrospective bias&lt;/span&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr style="overflow-wrap:break-word;"&gt;&lt;td class="cl-453fa356"&gt;&lt;p class="cl-453f9136"&gt;&lt;span class="cl-453dfd9e"&gt;Level 2: Neutral&lt;/span&gt;&lt;/p&gt;&lt;/td&gt;&lt;td class="cl-453fa357"&gt;&lt;p class="cl-453f9136"&gt;&lt;span class="cl-453dfd9e"&gt;Majority of indicators show no notable trends and/or no apparent environmental and ecosystem concerns.&lt;/span&gt;&lt;/p&gt;&lt;/td&gt;&lt;td class="cl-453fa358"&gt;&lt;p class="cl-453f9136"&gt;&lt;span class="cl-453dfd9e"&gt;Historical catches with moderate uncertainty, but reliable catches over the last 4+ decades; age and length composition data covering landed catch for fleets that account for the majority of removals, may be some gaps in time and/or for bycatch; species-specific maturity; fecundity may be based across species or regions&lt;/span&gt;&lt;/p&gt;&lt;/td&gt;&lt;td class="cl-453fa359"&gt;&lt;p class="cl-453f9136"&gt;&lt;span class="cl-453dfd9e"&gt;Moderate fits to data, multiple productivity parameters (recruitment, natural mortality, growth) are estimated internally, possible weak-moderate evidence for temporally and/or spatially varying biology not captured by model, weak-moderate long-term trends in recruitment not captured in the forecast, likelihood profiles and stable jitters indicate most parameters are well-estimated, some possible evidence of retrospective bias&lt;/span&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr style="overflow-wrap:break-word;"&gt;&lt;td class="cl-453fa35a"&gt;&lt;p class="cl-453f9136"&gt;&lt;span class="cl-453dfd9e"&gt;Level 3: Unfavorable&lt;/span&gt;&lt;/p&gt;&lt;/td&gt;&lt;td class="cl-453fa360"&gt;&lt;p class="cl-453f9136"&gt;&lt;span class="cl-453dfd9e"&gt;Majority of indicators show medium to high level of agreement and moderate to strong evidence supporting low species productivity&lt;/span&gt;&lt;/p&gt;&lt;/td&gt;&lt;td class="cl-453fa361"&gt;&lt;p class="cl-453f9136"&gt;&lt;span class="cl-453dfd9e"&gt;Uncertain catch reconstructions both historically and more recently; limited age composition data; maturity and fecundity based on other species and/or regions&lt;/span&gt;&lt;/p&gt;&lt;/td&gt;&lt;td class="cl-453fa362"&gt;&lt;p class="cl-453f9136"&gt;&lt;span class="cl-453dfd9e"&gt;Some problematic fits to data, most productivity parameters (recruitment, natural mortality, growth) are fixed or estimated externally, although recruitment deviations are estimable for some portion of the time series, they are only weakly informed by composition data; evidence for temporally and/or spatially varying biology not captured by model, long-term trends in recruitment not captured in the forecast, likelihood profiles and stable jitters indicate difficulty estimating parameters and a generally flat likelihood surface, evidence of retrospective bias&lt;/span&gt;&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

Potential Action:  
Favorable Conditions &amp;rarr; &lt;span style="background-color:#00FF0050;"&gt;Decrease Risk Buffer (Higher Catch Recommendation)&lt;/span&gt;  
Neutral Conditions &amp;rarr; Keep Standard Risk Buffer (Standard Catch Recommendation)  
Unfavorable Conditions &amp;rarr; &lt;span style="background-color:#FF000050;"&gt;Increase Risk Buffer (Lower Catch Recommendation)&lt;/span&gt;

## Details

Optimum Yield (OY) definition

*Magnuson-Stevens Act section (3)(33) defines “optimum,” with respect to the yield from a fishery, as the amount of fish that will provide the greatest overall benefit to the Nation, particularly with respect to food production and recreational opportunities and taking into account the protection of marine ecosystems;* 

*that is prescribed on the basis of the MSY from the fishery, as reduced by any relevant economic, social, or ecological factor;* 

*and, in the case of an overfished fishery, that provides for rebuilding to a level consistent with producing the MSY in such fishery.*

---
## Details

National standards

&gt;Standard 1. Conservation and management measures shall prevent overfishing while achieving, on a continuing basis, the optimum yield (OY) from each fishery for the U.S. fishing industry.
&gt;
[...] guidance on:
&gt;
(i) Specifying maximum sustainable yield (MSY) and OY;
&gt;
(ii) Specifying status determination criteria (SDC) so that overfishing and overfished determinations can be made for stocks and stock complexes in an FMP;
&gt;
(iii) Preventing overfishing and achieving OY, incorporation of scientific and management uncertainty in control rules, and adaptive management using annual catch limits (ACL) and measures to ensure accountability (i.e., accountability measures (AMs)); and
&gt;
(iv) Rebuilding stocks and stock complexes.

## Where can environmental change come in? National standard 1

&gt;(v) Specifying MSY. (A) ... MSY ... should be re-estimated as required by changes in long-term environmental or ecological conditions, fishery technological characteristics, or new scientific information.  
...  
(C) The MSY for a stock or stock complex is influenced by its interactions with other stocks in its ecosystem and these interactions may shift as multiple stocks in an ecosystem are fished. Ecological and environmental information should be taken into account, to the extent practicable, when assessing stocks and specifying MSY. Ecological and environmental information that is not directly accounted for in the specification of MSY can be among the ecological factors considered when setting OY below MSY.

&gt;(iii) Relationship of Status Determination Criteria (SDC) to environmental and habitat change. 
...  
(A) If environmental changes cause a stock or stock complex to fall below its MSST without affecting its long-term reproductive potential, fishing mortality must be constrained sufficiently to allow rebuilding within an acceptable time frame .... SDC should not be respecified.  

&gt;(B) If environmental, ecosystem, or habitat changes affect the long-term reproductive potential of the stock or stock complex, one or more components of the SDC must be respecified. Once SDC have been respecified, fishing mortality may or may not have to be reduced, depending on the status of the stock or stock complex with respect to the new criteria.
