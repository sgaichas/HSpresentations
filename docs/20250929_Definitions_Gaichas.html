# What is a SMART indicator?

* **Specific**: clearly defined, describing exactly what is measured at what scale and how the indicator is calculated so that methods can be repeated. The indicator can be directly linked to a management process objective.

* **Measurable**: appropriate quantitative or qualitative data are available to evaluate change over time or in space. Tied to measurable management process objective. 

* **Achievable**: responses to changes in management are detectable within the management time frame--objectives tied to the indicator must be achievable. 

* **Relevant**: accurately reflects changes in the underlying process of concern. The indicator can be directly linked to a management process objective. 

* **Time-bound**: how often is indicator measured and does this align with the process of concern, and the management process?


SMART indicators are Specific, Measurable, Achievable, Relevant, and Timely for the priority Council decisions. A SMART indicator for one process won't necessarily be SMART for another.

# What is Operational? **in use or ready for use**  

Components of an operational process:

*  Clear articulation of management objectives (use)

*  Standardized information updates on a regular reporting schedule

*  Feedbacks from the management system and adjustments to achieve management objectives

"Operationalizing" is an iterative process within a specific context

# Spectrum of operational management decisions

.pull-left[ 
## Strategic: 

### Decisions considering long term, high level goals and objectives. 

Examples: FMP development, risk policy, EAFM, research priorities

## Tactical: 

### Decisions in the short term that are implementing the strategies. 

Examples: Annual Catch Limits, specifications, commercial and recreational measures

]

.pull-right[

## Routine: 

### Decisions made or reviewed annually or more often across all the managed stocks

Examples: ACL, specifications, recreational measures, gear modifications 

## Occasional: 

### Decisions made over the longer term that modify the FMP, tailored to a particular management issue, that specify routine decisions

Examples: FMP Amendment, FMP Framework Action 

]

.center[
*SMART indicators for each of these decision types will differ*
]
