## Mini-Workshop Discussion 1: Indicators and approach
*  &lt;span style="color: blue;"&gt;**Risk policy:**&lt;/span&gt;  consider social or economic risk indicators in addition to stock status while retaining overall simplicity of the approach and broad scope for consistent application across species. Start by reviewing cases where the Council has suspended the risk policy. 
*  &lt;span style="color: blue;"&gt;**Catch/quota setting:**&lt;/span&gt; review and communicate ecosystem/habitat information available/used throughout the process to ensure indicators are not "double counted". Consider information used in prioritization and assessment but focus on developing new indicators for SSC ABC, Monitoring Committee, and Council processes. Consider a detailed application for a particular species.

--

## Mini-Workshop Discussion 2: Desirable and undesirable states
*  &lt;span style="color: blue;"&gt;**Desirable:**&lt;/span&gt;  transparent and relatively simple decision processes, decisions reflect reality, interannual stability, ability to assess tradeoffs across objectives
*  &lt;span style="color: blue;"&gt;**Undesirable:**&lt;/span&gt; overly complex processes, cascading unforeseen impacts of decisions resulting in reactive rather than proactive management, accounting for conditions in more than one place (double counting)

--

## Mini-Workshop Discussion 3: Targets and thresholds
*  &lt;span style="color: blue;"&gt;**Characteristics:**&lt;/span&gt;  targets as ranges rather than points, surveillance indicators to determine if conditions leave target range, historical baselines could provide initial target ranges but recognize and adapt to changing conditions, apply targets similarly across fishery sectors
*  &lt;span style="color: blue;"&gt;**Other considerations:**&lt;/span&gt; indicators that imply certainty or reduce uncertainty are desirable

## Priority Decision 2: Catch/Quota Setting

.table[
.ltbluebox[
**1. Determine Assessment Priorities**  
The NRCC prioritizes stocks for assessment based on management needs,
fishery importance, stock status and trend, ecosystem importance, assessment information, and stock
biology. Terms of Reference (ToRs) ensure the assessment process delivers consistent, management-relevant outputs.
]

.ltbluebox[
**2. Conduct Assessment**  
Assessment scientists assemble and analyze fishery dependent and independent data and develop models to synthesize the data and produce outputs meeting the assessment ToRs. 
]

.ltpurplebox[
**3. Review Assessment**  
Independent reviewers evaluate whether assessments ToRs are met, data is appropriate, and methods reflect best practices.
]
]
]

.pull-right[
.table[
.ltgreenbox[
### Council Steps 

.ltbluebox[
**4. Determine Acceptable Biological Catch (ABC)**  
The SSC uses reviewed assessment outputs within a structured framework to determine ABC from assessment uncertainty based on input data, model diagnostics and performance, and ecosystem considerations.
]

.ltbluebox[
**5. Catch Limits, Targets, and Quotas**  
The Council decides whether annually varying or averaged ABCs will be used in multiyear harvest specifications, then allocates the ABC to harvest sectors. Management uncertainty is determined and applied, then discards are estimated and subtracted to derive quotas and harvest limits.
]
]
]

Indicators could be used at any step but 3. 
Indicators are already used in Assessments and in SSC ABC Determinations.

## Priority Decision 2: Catch/Quota Setting Step 4--ABC
.pull-left[
.table[
.ltbluebox[

The MT assessment gives current status and short term projections of overfishing limit (OFL) that may or may not already include ecosystem information. The SSC may discuss performance of short term projections or terminal year estimates in the assessment; ecosystem information can inform decisions about projections or terminal year estimates. The SSC may request new OFL estimates/projections from the assessment lead based on this discussion. 

The SSC uses its [OFL CV process](https://www.mafmc.org/s/Final-OFL-CV-guidance-document_06_24.pdf) to evaluate uncertainty arising from data quality, model selection/identification, retrospective analysis, empirical comparisons,  ecosystem factors, and recruitment stanzas. Ecosystem information can feed into: 

*  Ecosystem factors: [Climate Vulnerability Analysis](https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0146756) results are currently included for each stock, can include multiple other environmentally driven changes in the stock
*  Recruitment stanzas: links to environmental drivers can decrease recruitment uncertainty

]
]
]

.pull-right[
.table[
.ltbluebox[
The OFL CV is used along with the estimate of current stock status in the [MAFMC ABC control rule](http://www.mafmc.org/s/MAFMC-ABC-Control-Rule-White-Paper.pdf) to determine the ABC that is recommended to the Council. The SSC often provides annually averaged constant ABC for a specified period (2-3 years) as well as annual ABC for each year at the request of the Council.
]

.ltgreenbox[
### Information sources for indicators 

[State of the Ecosystem](https://www.fisheries.noaa.gov/new-england-mid-atlantic/ecosystems/state-ecosystem-reports-northeast-us-shelf), [Risk Assessment](https://www.mafmc.org/s/2_MAB_RiskAssess_2024.pdf), and [Ecosystem and Socioeconomic Profiles](https://www.fisheries.noaa.gov/new-england-mid-atlantic/ecosystems/ecosystem-and-socioeconomic-profile-development-and-reports) conceptual models and indicators for MAFMC stocks could inform SSC discussion of terminal year estimates, short term projection performance, and assessment uncertainty. 

Similar indicators as above plus habitat indicators [EFH Habitat Mapper](https://www.fisheries.noaa.gov/resource/map/essential-fish-habitat-mapper), [NRHA Data Explorer](https://nrha.shinyapps.io/dataexplorer/) could further inform OFL CV discussions. Systematic translation of stock specific indicators into risk criteria as in the Pacific could simplify OFL CV discussions.

]
]
]

???
Ecosystem information that is presented along with the assessment is easiest to use in the OFL CV determination, but nothing limits the SSC from using ecosystem information presented from another source. The SSC has based decisions on published literature in the past.

## A potential framework

### Identify the decision

Risk policy: Council decides whether to apply the standard biology-based risk policy, or modify with social and economic factors? How much weight should social and economic factors get?

Catch/quota setting: SSC decides on assessment level, then decides on either OFL CV level using the structured process, or decides on an ABC

Catch/quota setting: Monitoring Committee decides whether to apply management uncertainty buffers to establish annual catch targets to account for inability to manage the catch or uncertainty in catch estimates

Catch/quota setting: Monitoring Committee decides how to estimate (dead) discards to set quotas or harvest limits

### Identify key information 

Which are the most important two factors to consider for the decision? Combined socioeconomic and biological?

What indicators do we have for the factors?

### Identify clear decision criteria

What threshold values move us between decisions?

## Priority Decision 2: Catch/Quota Setting Step 5--ACLs, ACTs, and Quotas

.pull-left[
.table[
.ltbluebox[
The Council decides whether to use constant ABC or annual ABC for the specification years.

The ABC is split to recreational and commercial sector Annual Catch Limit (ACL), if applicable: the percentage is defined in the FMP. Change requires an amendment or framework. 

The Monitoring Committee recommends a management uncertainty buffer to determine the Annual Catch Target (ACT) for each sector. 

The Monitoring Committee projects sector specific discards and subtracts them from each sector's ACT to determine the Recreational Harvest Limit (RHL) and the Commercial Quota. 

Commercial quota is allocated to states or seasons as specified in FMPs. Allocations require an amendment or framework to change.
]

.ltpurplebox[
**Clarify scope:** Should routine/tactical committee decisions, strategic FMP decisions, or all decisions be considered? 
]
