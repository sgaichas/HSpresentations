# Project Overview: Objectives

1) Review the different types of ecosystem data and information including data products and
decision-support tools (e.g. Ecosystem Status Reports, Climate Vulnerability Assessments, risk
assessments) currently available to the regional management councils and evaluate how they are
used in council management processes;

2) Identify opportunities and methods for incorporating identified ecosystem information into
SAFMC management processes, including inter-jurisdictional management decision-making
processes, and identify practical requirements for successful implementation (e.g. data quality,
frequency of information updates, regional council process consistency, implementation
timelines); and

3) Identify opportunities to continue to expand cooperative, constituent-engaged data collection
and research to improve the available ecosystem information in the South Atlantic region (e.g.,
study fleets, cooperative research, citizen science).

---
# Key Questions for the HEAP

Opportunities for incorporating ecosystem information into SAFMC Management Processes: Aligning EFH Policies with ecosystem indicators

*  Are the current indicators identified appropriately aligned with Habitat Policies?
*  Do you see any challenges with using the current information?
*  Are the potential indicators identified appropriate?
*  Can you suggest different indicators to monitor progress on habitat npolicy objectives?

Prototype Ecosystem Indicators:

*  Do the indicators make sense? Are they clearly explained?
*  Can you forsee any uses for a spatial indicator of bottom temperature?

Opportunities to expand cooperative data collection: 

*  Can cooperative research or citizen science validate model-derived habitat (bottom temperature) indicators?
*  Can you suggest other information to be collected by fishery participants or the public?

## Learning from the Councils: Diverse Ecosystem Approaches

**1. FMP/Indicator-Based (North Pacific, Pacific, Mid-Atlantic, New England)** 
- High-value, data-rich stocks with complex assessments 
- Annual ecosystem reports, indicators can inform assessments 
- Risk tables and uncertainty frameworks integrate ecosystem considerations 
- Non-regulatory Fishery Ecosystem Plans (FEPs) provide actionable pathways 

**2. FEP/Geography-Based (Western Pacific, Caribbean)** 
- Human community connections to complex and data-limited fisheries 
- Place-based ecosystem or fishery management plans serve as operational management documents 
- Co-developed with stakeholders reflecting distinct regional conditions 
- Ecosystem considerations embedded in management structure 

**3. Developing Approaches (South Atlantic, Gulf)** 
- Recreational fishery dominance with fewer assessments relative to managed species 
- Species-based FMPs with expanding ecosystem integration 
- South Atlantic links Essential Fish Habitat with ecosystem efforts 
- Gulf developing Fishery Ecosystem Issues as action-oriented framework 

---
## Common Management Concerns

.pull-left[
**Forage Fish**: Multiple Councils have implemented protections for unmanaged forage species or developed harvest control rules accounting for ecosystem services.
]
.pull-right[
**Climate Change**: All regions are addressing rapid ecosystem changes. Data-rich systems with long-term ecosystem reporting have experienced unexpected stock collapses, highlighting the need for climate-ready management approaches.
]

--

## Common Challenges

**Complexity of Ecosystem Information**: Council staff emphasize the need to provide information in "digestible packets," with clear linkages to management processes and decisions.

**Resource constraints**: Even data-rich regions identify capacity limitations for integrating ecosystem information into management.

**Stakeholder perceptions**: In some regions, considering ecosystem information is viewed as only increasing restrictions, rather than expanding opportunities. 

---
## Successful Practices

**Iterative Co-Development:** Ecosystem reports have been restructured with Council feedback in several regions, enhancing report utility. Most FEPs emphasize collaborative development of problem statements, analyses, conceptual models, model scenarios, and indicators with fishers, managers, and scientists.

--

**Risk-Based Frameworks:** North Pacific, Pacific, New England, Mid-Atlantic, and Caribbean are developing or have implemented indicator-based risk assessments to adjust catch advice and/or to support strategic decisions.

--

**Actionable FEPs:** “Action modules” (North Pacific), “Initiatives” (Pacific), “Fishery Ecosystem Issues” (Gulf), and the EAFM approach in the Mid-Atlantic provide structured pathways from fishery ecosystem plans to management action for specific, Council-selected issues. 

--

**Multi-scale Ecosystem Information:** Regular reporting at the ecosystem scale provides context for decisions and familiarity with ecosystem data. Stock-specific ecosystem reports link environmental drivers to individual stock productivity for use in stock assessment and catch specification. A structured dialogue process between ecosystem and stock assessment scientists is producing similar stock-level information in the Pacific.

---

## SAFMC Unique Strengths

*  Habitat-Ecosystem Integration: Explicitly links EFH policies with ecosystem approaches through comprehensive policy statements  
*  Citizen Science: Proactive incorporation of participatory data collection 
*  Existing Products: Recent Ecosystem Status Report, fish Climate Vulnerability Assessment, and fishing community CVA provide ready-to-use information
*  Modeling Investments: The regional food web model is poised to address Council questions


The South Atlantic’s combination of habitat focus, existing ecosystem tools, and commitment to stakeholder engagement provides a strong foundation for advancing ecosystem-based fishery management in ways responsive to the region’s unique challenges and opportunities.

## Preliminary Recommendations for SAFMC 

*  Hybrid Approach: Given mix of data-rich and data-limited stocks across diverse habitats, combining aspects of successful practices from different Councils has more potential than adopting a particular Council’s ecosystem approach

*  Leverage Existing Products: Align indicators from the South Atlantic ESR with objectives in EFH policy documents and CVA results to evaluate whether an integrated risk assessment framework could be developed

*  Formalize Action Process: Consider a process to develop explicit ecosystem initiatives or issues (similar to Pacific, North Pacific, Gulf) to move from planning to tangible management actions on priority topics

*  Update Reporting Frequency: Work toward more regular ecosystem reporting focused on Council-derived objectives and associated indicators produced with streamlined automation processes developed for the Caribbean ESR

*  Expand CVA Use: Consider climate vulnerability information in management processes where characterizing uncertainty is important (SSC ABC decisions)

*  Explore Novel Approaches: Evaluate multispecies management strategies using the existing food web model, considering both commercial yield and recreational fishing opportunity objectives

## Alignment of EFH/FEP policies and indicators

Given the Council emphasis on habitat issues, habitat FMPs and other policy documents were reviewed along with current ecosystem data products to evaluate “quick wins” aligning objectives and current indicators, and identifying where data from citizen science programs might augment existing indicator data products. 

.ltgreenbox[
Summary Results:

*  Food Web Policy: 5 of the 9 policies have potential indicators with high feasibility, 2 have moderate feasibility, and only 2 have low or unknown feasibility. Research information needs are already partially addressed by existing CVA and ESR indicators, and by current MSE efforts. 

*  Climate and Fisheries: current ESR indicators directly address policy statements. Gaps related to species distribution shifts and forecast conditions could be filled with existing information. Collaborative Council and NOAA review of current indicators should prioritize a subset for refinement and annual updates.

*  Existing ESR indicators for SAV, coastal habitat attributes, land use and ocean economy align with SAV policy.  However, comprehensive SAV indicators and research would require dedicated effort from multiple partners.
]

## Available Indicators

&lt;span style="color: blue;"&gt;**Ecosystem Status Report (ESR)**&lt;/span&gt;: a document summarizing ecosystem information for a particular region, spanning physical, biological, economic, and social information. 

*  Indicators are presented and interpreted in the context of historical trends and current status relative to any known reference points. 
*  Trends and status of indicators can contribute to risk assessment at the ecosystem or stock level. 
*  Also known as State of the Ecosystem (SOE) or Ecosystem Considerations reports. 

.center[
![:img SA ESR, 25%](https://github.com/sgaichas/HSpresentations/raw/main/docs/images/SATL-ESR-Cover.png)
]

.footnote[
Source: [South Atlantic ESR](https://repository.library.noaa.gov/view/noaa/33280) 
]
]

.pull-right[
&lt;span style="color: blue;"&gt;**Climate Vulnerability Assessment (CVA)**&lt;/span&gt;: an evaluation of vulnerability to projected climate conditions based on standard metrics of sensitivity and exposure appropriate to the species, habitat, or community being assessed. 

*  In addition to detailed narratives of risks faced by each species, habitat, or community, CVA outputs include a ranking of risk across species, habitats, or communities within a region, facilitating risk assessment. 
*  CVA has been applied to marine fish and invertebrates, marine fish and invertebrate habitats, marine mammals, and fishing communities.

.center[
![:img SACVA, 42%](https://journals.plos.org/climate/article/figure/image?size=large&amp;download=&amp;id=10.1371/journal.pclm.0000543.g002)![:img SACVAdist, 36%](https://journals.plos.org/climate/article/figure/image?size=large&amp;download=&amp;id=10.1371/journal.pclm.0000543.g005)

## Prototype Ocean Indicators

The feasibility of developing ocean indicators from global and regional ocean physics datasets for SAFMC habitat or other decisions was evaluated using methods developed for the Northeast U.S. shelf. 

Regional ocean models and global ocean models already provide both hindcasts and forecasts of ocean temperature and salinity for the South Atlantic.
*  NOAA MOM6 model (https://psl.noaa.gov/cefi_portal/)
*  Copernicus ocean reanalysis (https://data.marine.copernicus.eu/products)  

NEFSC has developed code to derive indicators from these data sources for the region north of Cape Hatteras. The code has been modified to derive prototype indicators for the South Atlantic region.

.pull-right[
The [Global Ocean Physics Reanalysis (GLORYS)](https://data.marine.copernicus.eu/product/GLOBAL_MULTIYEAR_PHY_001_030/description) brings worldwide observations into an ocean physics model. Observations are from satellites, ships, and fixed locations.

Information from 1993-May 2026 is currently included, with updates approximately each month.

"This product includes daily and monthly mean files for temperature, salinity, currents, sea level, mixed layer depth and ice parameters from the top to the bottom. The global ocean output files are displayed on a standard regular grid at 1/12° (approximatively 8 km) and on 50 standard levels."

## Integration with Citizen Science

One potential extension of existing South Atlantic cooperative data collection could be ocean temperature observations for comparison with regional or global ocean data products such as MOM6 and GLORYS. 

.pull-left[
Comparisons of vessel-collected temperature with model assimilated temperature can identify where improvements can be made to models as well as provide more direct information for management in near-real time. 

The Northeast U.S. eMOLT (Environmental Monitors on Lobster Traps and Large Trawlers) program regularly compares bottom temperature data collected aboard fishing vessels with regional ocean model bottom temperature predictions, highlighting both areas of agreement and areas where measurements and model predictions diverge.

.footnote[
Source: weekly eMOLT update email, George Maynard, eMOLT coordinator
]
]

## Cooperative Research

Multiple [cooperative research programs](https://www.fisheries.noaa.gov/southeast/science-data/cooperative-research-southeast) exist in the Southeast. A [study fleet](https://www.fisheries.noaa.gov/new-england-mid-atlantic/science-data/cooperative-research-northeast#study-fleet) could collect data for ecosystem indicators. 

Data collected by vessels participating in the NEFSC study fleet program have been used in species distribution modeling, biological studies, evaluation of potential ocean industry user conflicts, and as supporting data for stock assessment. 

This program also collects oceanographic indicators which are directly associated with haul level catch data, allowing analysis of habitat associations.
