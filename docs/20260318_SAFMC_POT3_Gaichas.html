## Presented [Tool and Use summary](https://sgaichas.github.io/HSpresentations/20260115_SAFMC_WK_EcoInfoTools_Gaichas.html) at the Ecosystem Data Workshop

## Learning from the Councils: Diverse Ecosystem Approaches

**1. FMP/Indicator-Based (North Pacific, Pacific, Mid-Atlantic, New England)** 
- High-value, data-rich stocks with complex assessments 
- Annual ecosystem reports, indicators can inform assessments 
- Risk tables and uncertainty frameworks integrate ecosystem considerations 
- Non-regulatory Fishery Ecosystem Plans (FEPs) provide actionable pathways 

**2. FEP/Geography-Based (Western Pacific, Caribbean)** 
- Human community connections to complex and data-limited fisheries 
- Place-based ecosystem or fishery management plans serve as operational management documents 
- Co-developed with stakeholders reflecting distinct regional conditions 
- Ecosystem considerations embedded in management structure 

**3. Developing Approaches (South Atlantic, Gulf)** 
- Recreational fishery dominance with fewer assessments relative to managed species 
- Species-based FMPs with expanding ecosystem integration 
- South Atlantic links Essential Fish Habitat with ecosystem efforts 
- Gulf developing Fishery Ecosystem Issues as action-oriented framework 

---
## Common Management Concerns

.pull-left[
**Forage Fish**: Multiple Councils have implemented protections for unmanaged forage species or developed harvest control rules accounting for ecosystem services.
]
.pull-right[
**Climate Change**: All regions are addressing rapid ecosystem changes. Data-rich systems with long-term ecosystem reporting have experienced unexpected stock collapses, highlighting the need for climate-ready management approaches.
]

--

## Common Challenges

**Complexity of Ecosystem Information**: Council staff emphasize the need to provide information in "digestible packets," with clear linkages to management processes and decisions.

**Resource constraints**: Even data-rich regions identify capacity limitations for integrating ecosystem information into management.

**Stakeholder perceptions**: In some regions, considering ecosystem information is viewed as only increasing restrictions, rather than expanding opportunities. 

---
## Successful Practices

**Iterative Co-Development:** Ecosystem reports have been restructured with Council feedback in several regions, enhancing report utility. Most FEPs emphasize collaborative development of problem statements, analyses, conceptual models, model scenarios, and indicators with fishers, managers, and scientists.

--

**Risk-Based Frameworks:** North Pacific, Pacific, New England, Mid-Atlantic, and Caribbean are developing or have implemented indicator-based risk assessments to adjust catch advice and/or to support strategic decisions.

--

**Actionable FEPs:** “Action modules” (North Pacific), “Initiatives” (Pacific), “Fishery Ecosystem Issues” (Gulf), and the EAFM approach in the Mid-Atlantic provide structured pathways from fishery ecosystem plans to management action for specific, Council-selected issues. 

--

**Multi-scale Ecosystem Information:** Regular reporting at the ecosystem scale provides context for decisions and familiarity with ecosystem data. Stock-specific ecosystem reports link environmental drivers to individual stock productivity for use in stock assessment and catch specification. A structured dialogue process between ecosystem and stock assessment scientists is producing similar stock-level information in the Pacific.

---

## SAFMC Unique Strengths

*  Habitat-Ecosystem Integration: Explicitly links EFH policies with ecosystem approaches through comprehensive policy statements  
*  Citizen Science: Proactive incorporation of participatory data collection 
*  Existing Products: Recent ESR, fish CVA, and fishing community CVA provide ready-to-use information
*  Modeling Investments: The regional food web model is poised to address Council questions


The South Atlantic’s combination of habitat focus, existing ecosystem tools, and commitment to stakeholder engagement provides a strong foundation for advancing ecosystem-based fishery management in ways responsive to the region’s unique challenges and opportunities.

## Preliminary Recommendations for SAFMC 

*  Hybrid Approach: Given mix of data-rich and data-limited stocks across diverse habitats, combining aspects of successful practices from different Councils has more potential than adopting a particular Council’s ecosystem approach

*  Leverage Existing Products: Align indicators from the South Atlantic ESR with objectives in EFH policy documents and CVA results to evaluate whether an integrated risk assessment framework could be developed

*  Formalize Action Process: Consider a process to develop explicit ecosystem initiatives or issues (similar to Pacific, North Pacific, Gulf) to move from planning to tangible management actions on priority topics

*  Update Reporting Frequency: Work toward more regular ecosystem reporting focused on Council-derived objectives and associated indicators produced with streamlined automation processes developed for the Caribbean ESR

*  Expand CVA Use: Consider climate vulnerability information in management processes where characterizing uncertainty is important (SSC ABC decisions)

*  Explore Novel Approaches: Evaluate multispecies management strategies using the existing food web model, considering both commercial yield and recreational fishing opportunity objectives

## Prototype Ocean Indicators


Regional ocean models and global ocean models already provide both hindcasts and forecasts of ocean temperature and salinity for the South Atlantic.
*  NOAA MOM6 model (https://psl.noaa.gov/cefi_portal/)
*  Copernicus ocean reanalysis (https://data.marine.copernicus.eu/products)  

NEFSC has developed code to derive indicators from these data sources for the region north of Cape Hatteras. The code could be modified to derive prototype indicators for the South Atlantic region. 


One potential extension of existing South Atlantic cooperative data collection could be ocean temperature observations for comparison with regional or global ocean data products such as MOM6 and GLORYS. 

Comparisons of vessel-collected temperature with model assimilated temperature can identify where improvements can be made to models as well as provide more direct information for management in near-real time. 


Another opportunity could be using a study fleet to collect data for ecosystem indicators. Data collected by vessels participating in the NEFSC study fleet program have been used in species distribution modeling, biological studies, evaluation of potential ocean industry user conflicts, and as supporting data for stock assessment [25]. This program also collects oceanographic indicators which are directly associated with haul level catch data, allowing analysis of habitat associations.

???
The Northeast U.S. eMOLT (Environmental Monitors on Lobster Traps and Large Trawlers) program regularly compares bottom temperature data collected aboard fishing vessels with regional ocean model bottom temperature predictions, highlighting both areas of agreement and areas where measurements and model predictions diverge.
