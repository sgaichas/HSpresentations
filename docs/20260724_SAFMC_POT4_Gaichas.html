# Project Overview: Objectives

1) Review the different types of ecosystem data and information including data products and
decision-support tools (e.g. Ecosystem Status Reports, Climate Vulnerability Assessments, risk
assessments) currently available to the regional management councils and evaluate how they are
used in council management processes;

2) Identify opportunities and methods for incorporating identified ecosystem information into
SAFMC management processes, including inter-jurisdictional management decision-making
processes, and identify practical requirements for successful implementation (e.g. data quality,
frequency of information updates, regional council process consistency, implementation
timelines); and

3) Identify opportunities to continue to expand cooperative, constituent-engaged data collection
and research to improve the available ecosystem information in the South Atlantic region (e.g.,
study fleets, cooperative research, citizen science).

# Results:  Objective 1

.pull-left[
## Common Challenges

**Complexity of Ecosystem Information**: Council staff emphasize the need to provide information in "digestible packets," with clear linkages to management processes and decisions.

**Resource constraints**: Even data-rich regions identify capacity limitations for integrating ecosystem information into management.

**Stakeholder perceptions**: In some regions, considering ecosystem information is viewed as only increasing restrictions, rather than expanding opportunities. 

]

--

.pull-right[
## Successful Practices

**Iterative co-production of processes and products:** Learn by doing, refine and adjust over time 

**Risk-based methods:** Adaptable to many decision processes, risk as a "two way street" 

**Actionable ecosystem plans:** Address management issues in digestible packets too! 

**Multi-scale ecosystem information:** Regular reporting of agreed key indicators increases familiarity and basis for action


]

.center[
Final Report updated to incorporate April SSC comments and [posted online](https://sgaichas.github.io/SAFMCindicators/AllCouncilDataReview.html)
]

## Results: Objectives 2 and 3

1. SAFMC already addresses ecosystem issues and requests ecosystem information in its decision making process. Further opportunities were identified for SAFMC to request or use ecosystem information its decision making process. These include assessment prioritization, defining assessment and MSE Terms of Reference, and collecting stakeholder observations of ecosystem, economic, and social conditions, as well as more complex processes. 

--

1. Existing SAFMC habitat and ecosystem policies align with existing ecosystem indicators, facilitating use of these indicators to support policy-related decisions.

--

1. The SAFMC ABC setting process (used in 3 FMPs) already has a framework where existing ecosystem indicators could be used to support risk rankings. A range of simpler to more complex approaches can be used to evaluate risks of overfishing. 

--

1. Information is available to develop spatially and seasonally resolved habitat indicators for the South Atlantic region from global ocean model data products. These indicators can be ground-truthed using both existing scientific surveys and by further developing existing Citizen Science priority research areas. 

--

1. SAFMC's multispecies complexes combined with its long term investment in food web modeling create an opportunity to evaluate multispecies management and reference points while accounting for species interactions. Management strategy evaluation could include climate scenarios as well as food web interactions to test the robustness of any multispecies management measures.

## EFH/FEP Policy Alignment: Available Indicators

&lt;span style="color: blue;"&gt;**Ecosystem Status Report (ESR)**&lt;/span&gt;: a document summarizing ecosystem information for a particular region, spanning physical, biological, economic, and social information. 

*  Indicators are presented and interpreted in the context of historical trends and current status relative to any known reference points. 
*  Trends and status of indicators can contribute to risk assessment at the ecosystem or stock level. 
*  Also known as State of the Ecosystem (SOE) or Ecosystem Considerations reports. 

.center[
![:img SA ESR, 25%](https://github.com/sgaichas/HSpresentations/raw/main/docs/images/SATL-ESR-Cover.png)
]

.footnote[
Source: [South Atlantic ESR](https://repository.library.noaa.gov/view/noaa/33280) 
]
]

.pull-right[
&lt;span style="color: blue;"&gt;**Climate Vulnerability Assessment (CVA)**&lt;/span&gt;: an evaluation of vulnerability to projected climate conditions based on standard metrics of sensitivity and exposure appropriate to the species, habitat, or community being assessed. 

*  In addition to detailed narratives of risks faced by each species, habitat, or community, CVA outputs include a ranking of risk across species, habitats, or communities within a region, facilitating risk assessment. 
*  CVA has been applied to marine fish and invertebrates, marine fish and invertebrate habitats, marine mammals, and fishing communities.

## EFH/FEP Policy Alignment: Summary

Given the Council emphasis on habitat issues, habitat FMPs and other policy documents were reviewed along with current ecosystem data products to evaluate “quick wins” aligning objectives and current indicators, and identifying where data from citizen science programs might augment existing indicator data products. 

.ltgreenbox[
Summary Results:

*  Food Web Policy: 5 of the 9 policies have potential indicators with high feasibility, 2 have moderate feasibility, and only 2 have low or unknown feasibility. Research information needs are already partially addressed by existing CVA and ESR indicators, and by current MSE efforts. 

*  Climate and Fisheries: current ESR indicators directly address policy statements. Gaps related to species distribution shifts and forecast conditions could be filled with existing information. Collaborative Council and NOAA review of current indicators should prioritize a subset for refinement and annual updates.

*  Existing ESR indicators for SAV, coastal habitat attributes, land use and ocean economy align with SAV policy.  However, comprehensive SAV indicators and research would require dedicated effort from multiple partners.
]

Dolphin-Wahoo, Golden Crab, Snapper Grouper

]

.pull-right[
Council reviews SSC and AP advice on risk rating.  
Council can deviate, up or down, from default P* by up to 10% (not exceeding 0.5).  

Specific attributes that can inform risk of overfishing:
* Biological:
    * Estimated natural mortality
    * Age at maturity
* Human Dimension:
    * Ability to regulate fishery
    * Potential for discard losses
    * Annual commercial value
    * Recreational desirability
    * Social concerns
* Environmental:
    * Ecosystem importance--&lt;span style="color: blue;"&gt;Food web indicators&lt;/span&gt; 
    * Climate change--&lt;span style="color: blue;"&gt;CVA indicators&lt;/span&gt; 
    * Other environmental variables--&lt;span style="color: blue;"&gt;stock specific indicators&lt;/span&gt; 
]

Modify [Pacific ecosystem factors](https://www.pcouncil.org/documents/2024/08/h-1-a-cciea-team-report-1-cciea-risk-table-report-on-fep-initiative-4.pdf/) for the South Atlantic:

*  Food webs (e.g., predator abundance or productivity, competitor abundance or productivity, spatial overlap with predators/competitors, prey abundance) &lt;span style="color: blue;"&gt;-- *could inform the SAFMC "ecosystem importance" risk attribute in addition to food web model*&lt;/span&gt;
*  Habitat availability (e.g., do current or near-term predictions of ocean temperatures and oxygen match known optimal ranges for [priority species] life history stages, closed area regulations) &lt;span style="color: blue;"&gt;-- *could inform the SAFMC "climate impact" risk attribute in addition to CVA*&lt;/span&gt; 
*  Changes in ecosystem productivity (e.g., upwelling indices, chlorophyll a, abundance of low trophic level organisms) &lt;span style="color: blue;"&gt;-- *"other environmental variables": related to regime shifts*&lt;/span&gt; 
*  Physiological indices (e.g., growth, condition, pathogens/parasites, stomach weight/fullness) &lt;span style="color: blue;"&gt;-- *"other environmental variables": possible drivers of recruitment trends*&lt;/span&gt; 
*  Reproductive indices (e.g., maturity, fecundity, spawn timing and duration) &lt;span style="color: blue;"&gt;-- *"other environmental variables": possible drivers of recruitment trends*&lt;/span&gt;

## Prototype Ocean Indicators

The feasibility of developing ocean indicators from global and regional ocean physics datasets for SAFMC habitat or other decisions was evaluated using methods developed for the Northeast U.S. shelf. 

Regional ocean models and global ocean models already provide both hindcasts and forecasts of ocean temperature and salinity for the South Atlantic.
*  NOAA MOM6 model (https://psl.noaa.gov/cefi_portal/)
*  Copernicus ocean reanalysis (https://data.marine.copernicus.eu/products)  

NEFSC has developed code to derive indicators from these data sources for the region north of Cape Hatteras. The code has been modified to derive prototype indicators for the South Atlantic region.

## Integration with Citizen Science

One potential extension of existing South Atlantic cooperative data collection could be ocean temperature observations for comparison with regional or global ocean data products such as MOM6 and GLORYS. 

.pull-left[
Comparisons of vessel-collected temperature with model assimilated temperature can identify where improvements can be made to models as well as provide more direct information for management in near-real time. 

The Northeast U.S. eMOLT (Environmental Monitors on Lobster Traps and Large Trawlers) program regularly compares bottom temperature data collected aboard fishing vessels with regional ocean model bottom temperature predictions, highlighting both areas of agreement and areas where measurements and model predictions diverge.

## Cooperative Research

Multiple [cooperative research programs](https://www.fisheries.noaa.gov/southeast/science-data/cooperative-research-southeast) exist in the Southeast. A [study fleet](https://www.fisheries.noaa.gov/new-england-mid-atlantic/science-data/cooperative-research-northeast#study-fleet) could collect data for ecosystem indicators. 

Data collected by vessels participating in the NEFSC study fleet program have been used in species distribution modeling, biological studies, evaluation of potential ocean industry user conflicts, and as supporting data for stock assessment. 

This program also collects oceanographic indicators which are directly associated with haul level catch data, allowing analysis of habitat associations.

The SAFMC food web model can be used to evaluate multispecies reference points and management procedures for stock complexes using the [Rpath](https://noaa-edab.github.io/Rpath/articles/Rpath.html) framework.

## Multispecies MSE

Multiple objectives can be compared between current single species approaches and management of stock complexes. SAFMC can shape analysis using similar approaches for stakeholder involvement as in current MSEs, but with less need to devote resources to operating model development.

In the New England example, stock complex management resulted in higher catch and lower underutlized quota with similar variability in catch and species status.

## Example Pathways for Action: Pacific

The Pacific Council FEP specifies goals and objectives as well as “ecosystem initiatives” that focus on priority actions. The Council annually reviews and updates its list of potential actions.

.pull-left-70[
* FEP Initiative 1 prohibited directed fishing on currently unexploited, unmanaged forage fish in the region  
* FEP Initiative 2 reviewed the ESR and made recommendations to better inform the Council of both ecosystem processes and the potential use of this information in management
* FEP Initiative 3 evaluated potential impacts of climate change and identified ways to improve flexibility and responsiveness of management
* FEP Initiative 4 Ecosystem and Climate Information for Species, Fisheries, and FMPs, is developing the risk-based framework for use in the Council’s catch specification process

]

.pull-right-30[
![:img Pac Council Groundfish process](https://github.com/sgaichas/SAFMCindicators/raw/main/docs/images/PFMC_WheelOfTimeFEP4.png)
]

Initiative 4 developed conceptual models of catch specification processes under the Coastal Pelagics, Groundfish, and Salmon FMPs, highlighting the timing of each step in the process and specific points where ecosystem information could be brought in. The structured process for developing the stock assessment risk table has enhanced communication between ecosystem and assessment scientists, and is highlighted as a key success of FEP Initiative 4. 


???
PFMC’s first FEP Initiative resulted in regulatory change after evaluating data and ecosystem science related to forage species. Initiatives 2 and 3 were more procedural in nature, while the current initiative 4 focuses on developing more operational uses of ecosystem information in the catch specification process.
