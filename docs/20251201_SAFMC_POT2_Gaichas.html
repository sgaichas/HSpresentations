# Project Update:  Objective 1

*Review the different types of ecosystem data and information including data products and decision-support tools (e.g. Ecosystem Status Reports, Climate Vulnerability Assessments, risk assessments) currently available to the regional management councils and evaluate how they are used in council management processes*

.pull-left[
**Literature search:** *&gt;97% complete*

* Council documents (policy guidance documents, FMPs/FEPs)
* Data products (Ecosystem Status Reports, Climate Vulnerability Assessments)
* Peer-reviewed literature

All 8 Councils, including SAFMC, plus selected others

Draft report 31 October, [update available online](https://sgaichas.github.io/SAFMCindicators/AllCouncilDataReview.html)

]

.pull-right[

**Semi-structured interviews:** *in progress*

* Key Council staff (2-4 per region)
* Interview Template:
    * Review/validate data products and uses of record from lit review
    * What other uses are not recorded?
    * Successes and challenges with current information and processes?
    * What might be done differently to better meet Council objectives?

35 Contacted, 7 Completed, 4 Scheduled
]

## How has MAFMC used the risk assessment?

* Risk based prioritization: the Council selected summer flounder for [conceptual modeling](https://nefsc.github.io/READ-SSB-DePiper_Summer_Flounder_Conceptual_Models/sfconsmod_riskfactors_subplots.html)

* Council completed management strategy evaluation (MSE) addressing [recreational fishery discards](https://www.mafmc.org/actions/summer-flounder-mse) based on conceptual modeling

* Stakeholder driven MSE coupled population and recreational demand models

![](https://github.com/NOAA-EDAB/presentations/raw/master/docs/EDAB_images/keepOneNoOFkey.png)

* Results: potential improvement in angler welfare with low risk to stock status, multispecies recreational demand model sets specifications
]

## Initial Synthesis: Three General Approaches 

1. FMP/Indicator-Based (NPFMC, PFMC, MAFMC, NEFMC) 
  - Species-based Fishery Management Plans with ecosystem overlays 
  - Annual ecosystem indicators inform catch specification decisions 
  - Risk tables and uncertainty frameworks integrate ecosystem considerations 
  - Non-regulatory Fishery Ecosystem Plans (FEPs) provide actionable pathways

2. FEP/Geography-Based (WPFMC, CFMC) 
  - Island or place-based ecosystem plans serve as operational management documents 
  - Co-developed with stakeholders reflecting distinct regional conditions 
  - Emphasis on human community connections and data-limited fisheries 
  - Ecosystem considerations embedded in management structure

3. Developing Approaches (SAFMC, GFMC) 
  - Species-based FMPs with expanding ecosystem integration 
  - SAFMC uniquely links Essential Fish Habitat (EFH) with ecosystem efforts 
  - Gulf developing Fishery Ecosystem Issues (FEIs) as action-oriented framework 
  - Both regions have recent ecosystem reports and climate vulnerability assessments


---
## Initial Synthesis:  SAFMC Unique Strengths

*  Habitat-Ecosystem Integration: Explicitly links EFH policies with ecosystem approaches through comprehensive policy statements  
*  Citizen Science: Proactive incorporation of participatory data collection 
*  Recent Assessments: Current fish CVA (2023) and fishing community CVA (2022) provide ready-to-use information
*  Existing Tools: ESR, Food web model, Conceptual models

**Suggestions**
*  SAFMC shares a mix of reef-type or west coast rockfish complex-like data limited species with some high value data rich stocks, so a mix of approaches from other regional Councils may be warranted, rather than adopting a single Council’s approach.

*  SAFMC has identified many ecosystem indicators and objectives in its EFH policy documents and also has a process to consider environmental information in ABC setting for multiple species; evaluation of indicators currently in the South Atlantic ESR and results of the fish and community CVAs are likely to reveal matched information as a basis for moving forward.

*  An explicit process for developing specific ecosystem initiatives, as applied through FEPs or similar policy documents in other regions (Gulf, Mid-Atlantic, Pacific, North Pacific) may allow SAFMC to explore practical ecosystem-based management for a particular fishery or issue.
